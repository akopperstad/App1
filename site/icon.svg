<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a4d"/>
      <stop offset="1" stop-color="#ff3d2e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0a0b0d"/>
  <!-- crown / start button -->
  <rect x="226" y="70" width="60" height="30" rx="10" fill="url(#g)"/>
  <rect x="247" y="96" width="18" height="26" fill="url(#g)"/>
  <!-- dial ring with a progress gap -->
  <circle cx="256" cy="292" r="150" fill="none" stroke="#1c1f24" stroke-width="34"/>
  <circle cx="256" cy="292" r="150" fill="none" stroke="url(#g)" stroke-width="34"
          stroke-linecap="round" stroke-dasharray="760 1000" transform="rotate(-90 256 292)"/>
  <!-- pulse line -->
  <polyline points="150,300 205,300 230,250 262,352 292,226 318,300 362,300"
            fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
