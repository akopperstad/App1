<!doctype html>
<!-- Marketing frame for the store screenshots. Driven by ../render.cjs, which calls
     window.renderFrame(spec) and screenshots the body at the exact store size.
     Rules: caption in the top ~22%, nothing important in the outer 4%,
     no price / promo claims, no third-party trademarks, opaque background. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body { position: relative; overflow: hidden; background: #050506;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter Display", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; }
  .bg { position: absolute; inset: 0; }
  body[data-bg="dark"] .bg { background:
      radial-gradient(60% 42% at 50% 62%, rgba(255, 91, 58, .30), transparent 72%),
      radial-gradient(70% 30% at 50% 0%, rgba(255, 91, 58, .10), transparent 70%),
      #050506; }
  body[data-bg="light"] .bg { background:
      radial-gradient(60% 40% at 50% 64%, rgba(255, 91, 58, .14), transparent 72%),
      linear-gradient(#f6f6f2, #ecebe5); }
  body[data-bg="coral"] .bg { background:
      radial-gradient(60% 45% at 50% 66%, rgba(255, 210, 190, .45), transparent 70%),
      linear-gradient(160deg, #ff6a45 0%, #ff5b3a 45%, #f0441f 100%); }

  .caption { position: absolute; left: 0; right: 0; text-align: center; display: flex; align-items: center; justify-content: center; }
  .caption h1 { margin: 0; font-weight: 900; letter-spacing: -0.03em; line-height: 1.04; text-wrap: balance; }
  .caption h1 em { font-style: normal; }
  body[data-bg="dark"] h1 { color: #f6f6f2; }
  body[data-bg="dark"] h1 em { color: #ff5b3a; }
  body[data-bg="light"] h1 { color: #0b0b0d; }
  body[data-bg="light"] h1 em { color: #ff5b3a; }
  body[data-bg="coral"] h1 { color: #ffffff; }
  body[data-bg="coral"] h1 em { color: #120806; }

  .device { position: absolute; box-sizing: border-box; background: #121316;
    box-shadow: 0 0 0 2px rgba(255,255,255,.10) inset, 0 40px 120px rgba(0,0,0,.45), 0 10px 30px rgba(0,0,0,.30); }
  body[data-bg="light"] .device { background: #1a1b1f; box-shadow: 0 0 0 2px rgba(255,255,255,.12) inset, 0 40px 110px rgba(40,20,10,.28), 0 8px 24px rgba(40,20,10,.18); }
  .screen { position: absolute; overflow: hidden; background: #000; }
  .screen > img.app { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }

  .sb { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between;
    font-weight: 650; letter-spacing: -0.01em; box-sizing: border-box; z-index: 3; }
  .sb svg { display: block; }
  .sb .icons { display: flex; align-items: center; }
  .home-ind { position: absolute; left: 50%; transform: translateX(-50%); border-radius: 999px; z-index: 3; }

  /* lock screen */
  .lock { position: absolute; inset: 0; overflow: hidden; }
  .lock .wall { position: absolute; inset: -6%; background-size: cover; background-position: center; filter: blur(28px) saturate(1.2) brightness(.55); }
  .lock .tint { position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,.15), rgba(0,0,0,.45)); }
  .lock .date { position: absolute; left: 0; right: 0; text-align: center; color: rgba(255,255,255,.9); font-weight: 600; }
  .lock .time { position: absolute; left: 0; right: 0; text-align: center; color: rgba(255,255,255,.95); font-weight: 700; letter-spacing: -0.02em; font-family: "Inter Display", Inter, sans-serif; }
  .lock .notes { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; }
  .note { background: rgba(245, 245, 245, .78); backdrop-filter: blur(20px); color: #111; display: flex; align-items: flex-start; box-sizing: border-box; }
  .note img { flex: none; }
  .note .txt { flex: 1; min-width: 0; }
  .note .row { display: flex; justify-content: space-between; align-items: baseline; }
  .note .app { font-weight: 700; }
  .note .ago { color: rgba(0,0,0,.5); }
  .note .ttl { font-weight: 700; }
  .note .body { color: rgba(0,0,0,.72); }
  .note.stack1 { opacity: .9; }
  .inset { position: absolute; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.15); }
  .inset img { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="caption"><h1 id="cap"></h1></div>
<div id="stage"></div>
<script>
const ICON = '../../graphics/src/icon.svg';

function statusBar(o, s, color) {
  // generic status bar: time + signal / wifi / battery, full and neutral
  const h = o.sb * s;
  const fs = (o.os === 'ios' ? 17 : 14) * s;
  const ih = fs * 0.72;
  const pad = (o.os === 'ios' ? (o.kind === 'tablet' ? 22 : 34) : 16) * s;
  const sig = `<svg width="${ih * 1.5}" height="${ih}" viewBox="0 0 18 12"><g fill="${color}"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></g></svg>`;
  const wifi = `<svg width="${ih * 1.4}" height="${ih}" viewBox="0 0 17 12"><g fill="${color}"><path d="M8.5 2.3c2.4 0 4.6.9 6.3 2.5l1.3-1.3A10.6 10.6 0 0 0 8.5.5 10.6 10.6 0 0 0 .9 3.5l1.3 1.3a8.9 8.9 0 0 1 6.3-2.5z"/><path d="M8.5 5.9c1.4 0 2.7.5 3.7 1.4l1.3-1.3a7 7 0 0 0-10 0l1.3 1.3c1-.9 2.3-1.4 3.7-1.4z"/><path d="M8.5 9.3c.5 0 1 .2 1.3.5L8.5 11.5 7.2 9.8c.3-.3.8-.5 1.3-.5z"/></g></svg>`;
  const bat = `<svg width="${ih * 2.2}" height="${ih}" viewBox="0 0 27 12"><rect x=".5" y=".5" width="22.5" height="11" rx="3.2" fill="none" stroke="${color}" stroke-opacity=".45"/><rect x="2.2" y="2.2" width="19.1" height="7.6" rx="1.8" fill="${color}"/><rect x="24.2" y="4" width="1.8" height="4" rx=".9" fill="${color}" fill-opacity=".45"/></svg>`;
  const gap = 6 * s;
  return `<div class="sb" style="height:${h}px;padding:0 ${pad}px;font-size:${fs}px;color:${color}">
    <span>9:41</span><span class="icons" style="gap:${gap}px">${sig}${wifi}${bat}</span></div>`;
}

function esc(t) { return t.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]); }
function captionHtml(t) { return esc(t).replace(/\*\*(.+?)\*\*/g, '<em>$1</em>'); }

function lockScreen(o, s, W, H) {
  const L = o.lock;
  const notes = L.notes.map((n, i) => `
    <div class="note${i > 0 ? ' stack' + i : ''}" style="border-radius:${22 * s}px;padding:${12 * s}px ${14 * s}px;gap:${10 * s}px;margin-top:${(i ? 8 : 0) * s}px">
      <img src="${ICON}" style="width:${38 * s}px;height:${38 * s}px;border-radius:${9 * s}px">
      <div class="txt">
        <div class="row" style="font-size:${13 * s}px"><span class="app">Pulse</span><span class="ago">${esc(n.ago)}</span></div>
        <div class="ttl" style="font-size:${16 * s}px;margin-top:${2 * s}px">${esc(n.title)}</div>
        ${n.body ? `<div class="body" style="font-size:${15 * s}px;margin-top:${1 * s}px">${esc(n.body)}</div>` : ''}
      </div>
    </div>`).join('');
  const insetW = W * 0.34;
  return `<div class="lock">
    <div class="wall" style="background-image:url('${o.screen}')"></div><div class="tint"></div>
    <div class="date" style="top:${H * 0.095}px;font-size:${21 * s}px">${esc(L.date)}</div>
    <div class="time" style="top:${H * 0.115}px;font-size:${96 * s}px">9:41</div>
    <div class="notes" style="top:${H * 0.40}px;padding:0 ${12 * s}px">${notes}</div>
  </div>`;
}

window.renderFrame = async function (o) {
  const [CW, CH] = o.canvas;
  document.body.style.width = CW + 'px';
  document.body.style.height = CH + 'px';
  document.body.dataset.bg = o.bg;

  const tablet = o.kind === 'tablet';
  const land = o.landscape || tablet;
  let [dw, dh] = o.device; // CSS px of the screen
  if (land && dh > dw) [dw, dh] = [dh, dw];
  const aspect = dh / dw;

  // ---- layout (canvas px)
  const side = CW * (tablet ? 0.06 : 0.07);
  const capTop = CH * (tablet ? 0.035 : 0.045);
  const capH = CH * (tablet ? 0.11 : 0.165);
  let devTop = CH * (tablet ? 0.17 : 0.225);
  const bottomMargin = CH * (tablet ? 0.035 : 0.03);
  let sw; // screen width in canvas px (before any rotation)
  const rotated = land && !tablet; // phone in landscape: shown turned 90° so it fills the portrait canvas
  const fitH = CH - devTop - bottomMargin;
  if (rotated) {
    // footprint after rotation: width = sh, height = sw
    sw = Math.min(fitH / 1.05, (CW * 0.74) / (aspect * 1.05));
  } else {
    // tablets may bleed slightly off the bottom edge (only bezel / bottom margin is cut)
    sw = tablet ? CW * 0.84 : Math.min(CW * 0.78, fitH / (aspect + 0.05));
  }
  const s = sw / dw; // CSS px → canvas px
  const sh = sw * aspect;
  const bez = Math.round((tablet ? 12 : 11) * s);
  const r = o.radius * s;

  // ---- caption, auto-fit to the box (max 2 lines on phones/tablets; 3 as a last resort)
  const cap = document.getElementById('cap');
  const box = cap.parentElement;
  box.style.top = capTop + 'px';
  box.style.height = capH + 'px';
  box.style.padding = `0 ${side}px`;
  cap.innerHTML = captionHtml(o.caption);
  let fs = CW * (tablet ? 0.05 : 0.088);
  const lh = 1.04;
  const fits = (lines) => cap.scrollWidth <= CW - 2 * side + 1 && cap.offsetHeight <= Math.min(capH, fs * lh * lines + 2);
  cap.style.fontSize = fs + 'px';
  while (!fits(2) && fs > CW * 0.035) { fs *= 0.97; cap.style.fontSize = fs + 'px'; }
  if (!fits(2)) while (!fits(3) && fs > CW * 0.03) { fs *= 0.97; cap.style.fontSize = fs + 'px'; }
  // never break inside a word: if a single word is wider than the box, shrink more
  const range = document.createRange();
  for (let i = 0; i < 40; i++) {
    range.selectNodeContents(cap);
    const rects = [...range.getClientRects()];
    if (rects.every((rc) => rc.width <= CW - 2 * side + 1)) break;
    fs *= 0.97; cap.style.fontSize = fs + 'px';
  }

  // ---- device
  const devW = sw + 2 * bez, devH = sh + 2 * bez;
  const left = (CW - devW) / 2;
  if (rotated) devTop = devTop + (fitH - devW) / 2 + (devW - devH) / 2; // centre the rotated footprint
  const tilt = rotated ? 90 : 0;
  const stage = document.getElementById('stage');
  const sbColor = o.statusDark ? '#0b0b0d' : '#ffffff';
  const inner = o.lock
    ? lockScreen(o, s, sw, sh)
    : `<img class="app" src="${o.screen}">`;
  const sbar = o.sb && !(land && !tablet) ? statusBar(o, s, o.lock ? '#ffffff' : sbColor) : '';
  const homeInd = o.os === 'ios'
    ? `<div class="home-ind" style="bottom:${8 * s}px;width:${(tablet ? 320 : 140) * s}px;height:${5 * s}px;background:${o.statusDark && !o.lock ? 'rgba(0,0,0,.85)' : 'rgba(255,255,255,.9)'}"></div>`
    : '';
  stage.innerHTML = `<div class="device" style="left:${left}px;top:${devTop}px;width:${devW}px;height:${devH}px;border-radius:${r + bez}px;transform:rotate(${tilt}deg)">
    <div class="screen" style="left:${bez}px;top:${bez}px;width:${sw}px;height:${sh}px;border-radius:${r}px">${inner}${sbar}${homeInd}</div></div>`;

  await Promise.all([...document.images].map((im) => (im.complete ? im.decode().catch(() => {}) : new Promise((res) => { im.onload = im.onerror = res; }))));
  await document.fonts.ready;
  const capRect = cap.getBoundingClientRect();
  return { fontSize: fs, capBottom: capRect.bottom, capLeft: capRect.left, capRight: capRect.right, devTop, devBottom: rotated ? devTop + devH / 2 + devW / 2 : devTop + devH, devTopVisible: rotated ? devTop + devH / 2 - devW / 2 : devTop, canvas: [CW, CH] };
};
</script>
</body>
</html>
